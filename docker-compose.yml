services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - platform-net

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - platform-net

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j-data:/data
    networks:
      - platform-net

  forecasting:
    build:
      context: ./services/forecasting
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=5001
    depends_on:
      - redis
    networks:
      - platform-net

  api:
    build: .
    ports:
      - "4000:4000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/polyglot_platform
      - REDIS_URL=redis://redis:6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - FORECASTING_SERVICE_URL=http://forecasting:5001
      - OPTIMIZER_INTERVAL_SECONDS=30
      - OPTIMIZER_PROMOTE_THRESHOLD=3
      - OPTIMIZER_DEMOTE_THRESHOLD=1
      - OPTIMIZER_CACHE_TTL_SECONDS=300
      - LLM_PROVIDER=mock
      - PORT=4000
    depends_on:
      - redis
      - mongo
      - neo4j
      - forecasting
    networks:
      - platform-net

networks:
  platform-net:

volumes:
  redis-data:
  mongo-data:
  neo4j-data:
